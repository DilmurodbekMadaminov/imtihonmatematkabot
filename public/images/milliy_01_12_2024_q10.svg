<svg viewBox="0 0 400 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" rx="12" fill="#F8FAFC"/>
  
  <!-- Ground reference & buildings -->
  <line x1="40" y1="180" x2="360" y2="180" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3"/>
  
  <!-- Point B (Left Building position) -->
  <circle cx="70" cy="180" r="4" fill="#0f172a"/>
  <text x="65" y="200" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">B</text>
  
  <!-- Point C (House position) -->
  <circle cx="230" cy="180" r="4" fill="#0f172a"/>
  <text x="235" y="198" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">C</text>
  
  <!-- Line AB (shortest path/displacement - dashed red) -->
  <line x1="70" y1="180" x2="300" y2="110" stroke="#EF4444" stroke-width="2.2" stroke-dasharray="5"/>
  <text x="180" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#EF4444">d = ?</text>
  
  <!-- Path BC (15√2) -->
  <line x1="70" y1="180" x2="230" y2="180" stroke="#0f172a" stroke-width="2.5"/>
  <text x="135" y="170" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0f172a">15√2</text>
  
  <!-- Path CA (5) -->
  <line x1="230" y1="180" x2="300" y2="110" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="300" cy="110" r="4" fill="#0f172a"/>
  <text x="310" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">A</text>
  <text x="275" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0f172a">5</text>
  
  <!-- 135° Angle Arc indicator -->
  <path d="M 205,180 A 25,25 0 0,1 247.7,162.3" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="175" y="160" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6366f1">135°</text>
</svg>
