<svg viewBox="0 0 400 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" rx="12" fill="#F8FAFC"/>
  
  <!-- Triangle ABC -->
  <polygon points="60,200 200,60 340,200" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Line EF -->
  <line x1="235" y1="95" x2="130" y2="200" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4"/>
  
  <!-- Labels for Vertices -->
  <text x="45" y="215" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1E293B">A</text>
  <text x="195" y="50" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1E293B">B</text>
  <text x="345" y="215" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1E293B">C</text>
  <text x="245" y="90" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#EF4444">E</text>
  <text x="115" y="218" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#EF4444">F</text>
  
  <!-- Length Values -->
  <text x="100" y="125" font-family="'Inter', sans-serif" font-size="13" font-weight="605" fill="#475569">16</text>
  <text x="190" y="145" font-family="'Inter', sans-serif" font-size="13" font-weight="605" fill="#EF4444">12</text>
  <text x="230" y="215" font-family="'Inter', sans-serif" font-size="13" font-weight="605" fill="#EF4444">x</text>
  
  <!-- Bottom Total Dimension Line -->
  <path d="M 60,225 L 340,225" stroke="#475569" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="60" y1="220" x2="60" y2="230" stroke="#475569" stroke-width="1.2"/>
  <line x1="340" y1="220" x2="340" y2="230" stroke="#475569" stroke-width="1.2"/>
  <rect x="185" y="215" width="30" height="20" rx="4" fill="#F8FAFC"/>
  <text x="190" y="229" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#475569">20</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
