app = "telegram-math-bot-app" # Bu nomni o'zgartirishingiz mumkin
primary_region = "fra" # Frankfurt (yoki o'zingizga yaqin region)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/data"

[mounts]
  source = "bot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
